[package]
name = "hamesh"
version = "0.1.2"
description = "Hāmesh — a local-first ebook reader"
authors = ["Hāmesh contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hamesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
