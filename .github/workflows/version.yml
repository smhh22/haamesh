name: Version

on:
  # Releases are user-approved (AGENTS.md): nothing tags on push. The user is
  # asked after each merge; a yes runs this workflow manually
  # (`gh workflow run version.yml`), which cuts ONE release from everything
  # accumulated since the previous tag.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          version=${latest#v}
          IFS=. read -r major minor patch <<< "$version"
          subjects=$(git log --pretty=format:%s "${latest}..HEAD")
          if [ -z "$subjects" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commits since $latest."
            exit 0
          fi
          lower=$(printf '%s' "$subjects" | tr '[:upper:]' '[:lower:]')

          # The strongest signal in the whole batch decides the bump.
          if printf '%s' "$subjects" | grep -qi 'breaking change' || [[ "$lower" == *'!:'* ]]; then
            major=$((major + 1)); minor=0; patch=0
          elif printf '%s\n' "$subjects" | grep -qiE '^feat(\(.+\))?:'; then
            minor=$((minor + 1)); patch=0
          elif printf '%s\n' "$subjects" | grep -qiE '^(fix|perf|refactor)(\(.+\))?:'; then
            patch=$((patch + 1))
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only internal commits since $latest; nothing to release."
            exit 0
          fi

          tag="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists; nothing to release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag ($(printf '%s' "$subjects" | wc -l) commits since $latest)"

      - if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$(git rev-parse HEAD)"
          gh workflow run release.yml --ref main -f version="${TAG}"
