name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, for example v0.1.3"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    outputs:
      body: ${{ steps.body.outputs.body }}
    steps:
      # Full history so the notes can be computed between tags. The script
      # comes from the workflow ref (main for a dispatch, the tag for a push).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the release notes from commits
        id: body
        run: |
          set -euo pipefail
          previous=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v "^${RELEASE_TAG}$" | head -n1 || true)
          if [ -n "$previous" ]; then
            node scripts/release-notes.mjs "$previous" "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
          else
            echo "First release." > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo "body<<__NOTES__"
            cat "$RUNNER_TEMP/notes.md"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" --draft \
              --title "Hāmesh $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the release version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='apps/reader/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.RELEASE_TAG.replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: tauri-action does not inherit secrets implicitly.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Hāmesh ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri

      - name: Install Android SDK packages
        run: |
          # The runner image ships cmdline-tools but not on PATH.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the release version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='apps/reader/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.RELEASE_TAG.replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hamesh-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/hamesh-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"

      - name: Build the signed APK
        env:
          HAMESH_KEYSTORE_PROPERTIES: ${{ runner.temp }}/keystore.properties
        run: pnpm --filter @hamesh/reader tauri android build --apk

      - name: Upload the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          # gh on the runners does not support the file#name rename syntax;
          # copy to the release name first.
          cp apps/reader/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$RUNNER_TEMP/Hamesh_${version}_universal.apk"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Hamesh_${version}_universal.apk" --clobber

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Publish after every installer uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Concurrent release runs finish out of order (Windows/Android take
          # different times), so an older tag can publish last and steal the
          # "Latest" marker. Only the highest semver tag owns it.
          newest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]' | sort -V | tail -n1)
          if [ "$RELEASE_TAG" = "$newest" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            # Publishing a draft claims the Latest marker by default, so an
            # older tag publishing last must explicitly decline it.
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Check the published manifest and installers
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          version="${RELEASE_TAG#v}"
          curl -fsSL "${base}/latest.json" -o latest.json
          python3 - "$version" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          data = json.load(open("latest.json"))
          assert data.get("version") == version, f"manifest version {data.get('version')} != {version}"
          assert data.get("notes"), "latest.json has no release notes"
          platforms = set(data.get("platforms", {}))
          required = {"linux-x86_64", "linux-x86_64-deb", "windows-x86_64", "windows-x86_64-msi"}
          missing = required - platforms
          assert not missing, f"missing platforms: {sorted(missing)}"
          print(f"verified {version}: {len(platforms)} platform entries")
          PY
          curl -fsIL "${base}/Hamesh_${version}_amd64.deb" -o /dev/null
          curl -fsIL "${base}/Hamesh_${version}_x64-setup.exe" -o /dev/null
          curl -fsIL "${base}/Hamesh_${version}_universal.apk" -o /dev/null

      # Release runs are dispatched by the Version workflow's token, so the
      # `workflow_run` trigger in screenshots.yml never fires for them. Ask for
      # the refresh explicitly, and only when this tag is still the newest.
      - name: Refresh README screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          newest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]' | sort -V | tail -n1)
          if [ "$RELEASE_TAG" = "$newest" ]; then
            gh workflow run screenshots.yml --ref main
          else
            echo "$RELEASE_TAG was superseded by $newest; screenshots follow the newest release."
          fi
